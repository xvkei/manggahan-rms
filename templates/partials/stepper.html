{# expects step = 1, 2, or 3 #}
<ol class="stepper" aria-label="Booking progress">
  <li class="{% if step > 1 %}done{% elif step == 1 %}now{% endif %}" {% if step == 1 %}aria-current="step"{% endif %}>
    <span class="dot">{% if step > 1 %}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>{% else %}1{% endif %}</span>Choose a slot
  </li>
  <li class="{% if step > 2 %}done{% elif step == 2 %}now{% endif %}" {% if step == 2 %}aria-current="step"{% endif %}>
    <span class="dot">{% if step > 2 %}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>{% else %}2{% endif %}</span>Details &amp; payment
  </li>
  <li class="{% if step == 3 %}now{% endif %}" {% if step == 3 %}aria-current="step"{% endif %}>
    <span class="dot">{% if step == 3 %}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>{% else %}3{% endif %}</span>Confirmed
  </li>
</ol>
